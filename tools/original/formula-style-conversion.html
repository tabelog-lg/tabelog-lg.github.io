<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公式格式转换工具</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4a6cf7;
            --primary-hover: #3b5de7;
            --success: #22c55e;
            --success-hover: #16a34a;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --border: #e5e7eb;
            --text: #1f2937;
            --text-secondary: #6b7280;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 4px 24px rgba(0, 0, 0, 0.04);
            --radius: 12px;
            --radius-sm: 8px;
            --transition: 0.2s ease;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', -apple-system, sans-serif;
            background: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            padding: 32px 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 1280px;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 32px 28px;
            border: 1px solid var(--border);
        }

        /* ========== 标题 ========== */
        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .header h1 .icon {
            font-size: 30px;
        }
        .header p {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 6px;
        }

        /* ========== 主区域：输入/输出 ========== */
        .main-area {
            display: flex;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .textarea-wrapper {
            flex: 1 1 0;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .textarea-wrapper label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }
        .textarea-wrapper label .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot.input-dot {
            background: var(--primary);
        }
        .dot.output-dot {
            background: var(--success);
        }

        .textarea-wrapper textarea {
            flex: 1;
            min-height: 280px;
            padding: 16px 18px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: border-color var(--transition), box-shadow var(--transition);
            background: #fafbfc;
            color: var(--text);
            outline: none;
            white-space: pre-wrap;
            word-wrap: break-word;
            tab-size: 4;
        }
        .textarea-wrapper textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
            background: #fff;
        }
        .textarea-wrapper textarea#mainOutput {
            background: #f8faf9;
            color: #1a3c34;
        }
        .textarea-wrapper textarea#mainOutput:focus {
            border-color: var(--success);
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
            background: #fff;
        }
        .textarea-wrapper textarea::placeholder {
            color: #9ca3af;
            font-style: italic;
        }
        .textarea-wrapper textarea[readonly] {
            cursor: default;
            -webkit-user-select: text;
            user-select: text;
        }

        .char-count {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: right;
            margin-top: 4px;
            font-family: var(--font-mono);
            opacity: 0.7;
        }

        /* ========== 按钮组 ========== */
        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: center;
            align-items: stretch;
            padding: 0 4px;
            min-width: 150px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border: none;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            letter-spacing: 0.3px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn:focus-visible {
            outline: 3px solid rgba(74, 108, 247, 0.4);
            outline-offset: 2px;
        }
        .btn-convert {
            background: var(--primary);
            color: #fff;
            border: 2px solid var(--primary);
        }
        .btn-convert:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
            box-shadow: 0 4px 14px rgba(74, 108, 247, 0.35);
        }
        .btn-clear {
            background: #fef2f2;
            color: var(--danger);
            border: 2px solid #fecaca;
        }
        .btn-clear:hover {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
        }
        .btn-copy {
            background: #ecfdf5;
            color: var(--success);
            border: 2px solid #a7f3d0;
        }
        .btn-copy:hover {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
            box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
        }
        .btn-copy.copied {
            background: var(--success);
            color: #fff;
            border-color: var(--success);
            animation: pop 0.35s ease;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        /* ========== 分隔线 ========== */
        .divider {
            border: none;
            border-top: 2px dashed var(--border);
            margin: 8px 0 28px;
        }

        /* ========== 设置区域 ========== */
        .options-section {
            margin-top: 4px;
        }
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .section-header h2 {
            font-size: 16px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-header h2 .badge {
            background: var(--primary);
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            letter-spacing: 0.5px;
        }
        .section-header .hint {
            font-size: 12px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .option-row {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .option-label {
            flex: none;
            min-width: 76px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        /* ---- 风格单选卡片 ---- */
        .radio-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            flex: 1;
            min-width: 0;
        }
        .radio-item {
            flex: 1 1 180px;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fafbfc;
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .radio-item:hover {
            border-color: #c7d2fe;
            background: #f5f7ff;
        }
        .radio-item.active {
            border-color: var(--primary);
            background: #eef2ff;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
        }
        .radio-item input[type="radio"] {
            flex: none;
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .radio-text {
            display: flex;
            flex-direction: column;
            gap: 1px;
            min-width: 0;
        }
        .radio-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            line-height: 1.3;
        }
        .radio-desc {
            font-size: 11.5px;
            font-family: var(--font-mono);
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .radio-item.active .radio-title {
            color: var(--primary);
        }

        /* ---- 复选框 ---- */
        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-sm);
            background: #fafbfc;
            cursor: pointer;
            transition: all var(--transition);
            user-select: none;
            flex: 1;
            min-width: 0;
            font-size: 13.5px;
            font-weight: 600;
            color: var(--text);
            -webkit-tap-highlight-color: transparent;
        }
        .checkbox-item:hover {
            border-color: #c7d2fe;
            background: #f5f7ff;
        }
        .checkbox-item.checked {
            border-color: var(--primary);
            background: #eef2ff;
            box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
        }
        .checkbox-item input[type="checkbox"] {
            flex: none;
            width: 17px;
            height: 17px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .checkbox-item em {
            font-style: normal;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        /* ========== 响应式 ========== */
        @media (max-width: 768px) {
            body {
                padding: 16px 10px;
            }
            .container {
                padding: 20px 14px;
            }
            .main-area {
                flex-direction: column;
                gap: 16px;
            }
            .textarea-wrapper {
                min-width: 100%;
            }
            .textarea-wrapper textarea {
                min-height: 170px;
            }
            .button-group {
                flex-direction: row;
                flex-wrap: wrap;
                min-width: 100%;
                justify-content: stretch;
                padding: 0;
            }
            .button-group .btn {
                flex: 1 1 100px;
                min-width: 100px;
            }
            .header h1 {
                font-size: 22px;
            }
            .option-row {
                flex-direction: column;
                align-items: stretch;
                gap: 10px;
            }
            .option-label {
                min-width: 0;
            }
            .radio-group {
                flex-direction: column;
            }
            .radio-item {
                flex: 1 1 auto;
            }
            .checkbox-item {
                align-items: flex-start;
            }
        }
        @media (max-width: 400px) {
            .button-group .btn {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>
                <span class="icon">∑</span> 公式格式转换
            </h1>
            <p>自动识别 Markdown / LaTeX / MathML 公式标记 · 一键统一风格 · 实时预览</p>
        </div>

        <!-- 主区域 -->
        <div class="main-area">
            <!-- 输入框 -->
            <div class="textarea-wrapper">
                <label><span class="dot input-dot"></span> 输入文本</label>
                <textarea id="mainInput" placeholder="在此输入或粘贴包含公式的文本..." spellcheck="false"></textarea>
                <span class="char-count" id="inputCharCount">0 字符</span>
            </div>

            <!-- 输出框 -->
            <div class="textarea-wrapper">
                <label><span class="dot output-dot"></span> 输出结果</label>
                <textarea id="mainOutput" readonly placeholder="转换结果将实时显示在这里..." spellcheck="false"></textarea>
                <span class="char-count" id="outputCharCount">0 字符</span>
            </div>

            <!-- 按钮组 -->
            <div class="button-group">
                <button class="btn btn-convert" id="convertBtn" title="按当前设置重新转换（输入变化时会自动转换）">
                    🚀 转换
                </button>
                <button class="btn btn-clear" id="clearBtn" title="清空输入和输出框">
                    🗑️ 清空
                </button>
                <button class="btn btn-copy" id="copyBtn" title="复制输出框内容到剪贴板（Ctrl+Enter）">
                    📋 复制到剪切板
                </button>
            </div>
        </div>

        <hr class="divider">

        <!-- 设置区域 -->
        <div class="options-section">
            <div class="section-header">
                <h2>
                    ⚙️ 转换设置
                    <span class="badge" id="formulaBadge">0 个公式</span>
                </h2>
                <span class="hint">💡 无论输入是哪种风格，都会被识别并统一转换为所选风格</span>
            </div>

            <!-- 目标风格 -->
            <div class="option-row">
                <span class="option-label">目标风格</span>
                <div class="radio-group">
                    <label class="radio-item active" data-style="markdown">
                        <input type="radio" name="style" value="markdown" checked>
                        <span class="radio-text">
                            <span class="radio-title">Markdown</span>
                            <span class="radio-desc">$...$ / $$...$$</span>
                        </span>
                    </label>
                    <label class="radio-item" data-style="latex">
                        <input type="radio" name="style" value="latex">
                        <span class="radio-text">
                            <span class="radio-title">LaTeX</span>
                            <span class="radio-desc">\(...\) / \[...\]</span>
                        </span>
                    </label>
                    <label class="radio-item" data-style="mathml">
                        <input type="radio" name="style" value="mathml">
                        <span class="radio-text">
                            <span class="radio-title">MathML</span>
                            <span class="radio-desc">&lt;math&gt;...&lt;/math&gt;</span>
                        </span>
                    </label>
                </div>
            </div>

            <!-- 换行块级公式 -->
            <div class="option-row">
                <span class="option-label">块级格式</span>
                <label class="checkbox-item checked" id="blockNewlineWrap">
                    <input type="checkbox" id="blockNewline" checked>
                    <span>
                        换行块级公式
                        <em>（内容与标记之间换行，如 \[ ⏎ ... ⏎ \]；MathML 下 &lt;math&gt;⏎...⏎&lt;/math&gt; 视为块级）</em>
                    </span>
                </label>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ========== DOM 引用 ==========
            const mainInput = document.getElementById('mainInput');
            const mainOutput = document.getElementById('mainOutput');
            const clearBtn = document.getElementById('clearBtn');
            const copyBtn = document.getElementById('copyBtn');
            const convertBtn = document.getElementById('convertBtn');
            const blockNewlineChk = document.getElementById('blockNewline');
            const blockNewlineWrap = document.getElementById('blockNewlineWrap');
            const inputCharCount = document.getElementById('inputCharCount');
            const outputCharCount = document.getElementById('outputCharCount');
            const formulaBadge = document.getElementById('formulaBadge');
            const styleRadios = Array.prototype.slice.call(
                document.querySelectorAll('input[name="style"]')
            );
            const radioItems = Array.prototype.slice.call(
                document.querySelectorAll('.radio-item')
            );

            let copiedTimeout = null;

            // ========== 默认示例文本 ==========
            const DEFAULT_INPUT = [
                '质能方程 $E = mc^2$ 由爱因斯坦提出。',
                '',
                '$$',
                '\\int_0^\\infty e^{-x^2}\\,dx = \\frac{\\sqrt{\\pi}}{2}',
                '$$',
                '',
                '洛伦兹因子 \\( \\gamma = \\frac{1}{\\sqrt{1 - v^2/c^2}} \\) 出现在相对论中。',
                '',
                '<math>',
                '  a^2 + b^2 = c^2',
                '</math>'
            ].join('\n');

            // ============================================================
            //  解析：把文本拆成「普通文本 / 行内公式 / 块级公式」节点
            //  支持输入中混用三种风格的标记
            // ============================================================
            function parseFormulas(text, blockNewline) {
                const nodes = [];
                let buffer = '';
                let i = 0;

                const flush = () => {
                    if (buffer) {
                        nodes.push({ type: 'text', content: buffer });
                        buffer = '';
                    }
                };

                while (i < text.length) {
                    const rest = text.slice(i);

                    // ---- $$ ... $$ → 块级 ----
                    if (rest.startsWith('$$')) {
                        const end = text.indexOf('$$', i + 2);
                        if (end !== -1) {
                            flush();
                            nodes.push({ type: 'block', content: text.slice(i + 2, end).trim() });
                            i = end + 2;
                            continue;
                        }
                    }

                    // ---- \[ ... \] → 块级 ----
                    if (rest.startsWith('\\[')) {
                        const end = text.indexOf('\\]', i + 2);
                        if (end !== -1) {
                            flush();
                            nodes.push({ type: 'block', content: text.slice(i + 2, end).trim() });
                            i = end + 2;
                            continue;
                        }
                    }

                    // ---- \( ... \) → 行内 ----
                    if (rest.startsWith('\\(')) {
                        const end = text.indexOf('\\)', i + 2);
                        if (end !== -1) {
                            flush();
                            nodes.push({ type: 'inline', content: text.slice(i + 2, end).trim() });
                            i = end + 2;
                            continue;
                        }
                    }

                    // ---- <math ...> ... </math> ----
                    if (rest.startsWith('<math')) {
                        const openEnd = text.indexOf('>', i + 5);
                        if (openEnd !== -1) {
                            const openTag = text.slice(i, openEnd + 1);
                            if (/^<math(\s[^>]*)?>$/.test(openTag)) {
                                const closeIdx = text.indexOf('</math>', openEnd + 1);
                                if (closeIdx !== -1) {
                                    const inner = text.slice(openEnd + 1, closeIdx);
                                    // MathML 没有行内/行间之分：
                                    // 开启「换行块级公式」时，<math>\n...\n</math> 视为块级；否则一律视为行内
                                    let isBlock = false;
                                    if (blockNewline && inner.startsWith('\n') && /\n\s*$/.test(inner)) {
                                        isBlock = true;
                                    }
                                    flush();
                                    nodes.push({
                                        type: isBlock ? 'block' : 'inline',
                                        content: inner.trim()
                                    });
                                    i = closeIdx + 7; // '</math>'.length
                                    continue;
                                }
                            }
                        }
                    }

                    // ---- $ ... $ → 行内 ----
                    if (text[i] === '$') {
                        const end = text.indexOf('$', i + 1);
                        if (end > i + 1) {
                            flush();
                            nodes.push({ type: 'inline', content: text.slice(i + 1, end).trim() });
                            i = end + 1;
                            continue;
                        }
                    }

                    buffer += text[i];
                    i++;
                }

                flush();
                return nodes;
            }

            // ============================================================
            //  渲染：把节点按目标风格还原成文本
            // ============================================================
            function renderNodes(nodes, style, blockNewline) {
                const out = [];

                for (let k = 0; k < nodes.length; k++) {
                    const node = nodes[k];

                    if (node.type === 'text') {
                        out.push(node.content);
                        continue;
                    }

                    const isBlock = (node.type === 'block');
                    const c = node.content;

                    if (style === 'markdown') {
                        if (isBlock) {
                            out.push(blockNewline ? '$$\n' + c + '\n$$' : '$$' + c + '$$');
                        } else {
                            out.push('$' + c + '$');
                        }
                    } else if (style === 'latex') {
                        if (isBlock) {
                            out.push(blockNewline ? '\\[\n' + c + '\n\\]' : '\\[' + c + '\\]');
                        } else {
                            out.push('\\(' + c + '\\)');
                        }
                    } else { // mathml
                        if (isBlock && blockNewline) {
                            out.push('<math>\n' + c + '\n</math>');
                        } else {
                            out.push('<math>' + c + '</math>');
                        }
                    }
                }

                return out.join('');
            }

            // ========== 工具函数 ==========
            function getSelectedStyle() {
                for (let k = 0; k < styleRadios.length; k++) {
                    if (styleRadios[k].checked) return styleRadios[k].value;
                }
                return 'markdown';
            }

            function updateCharCounts() {
                inputCharCount.textContent = mainInput.value.length + ' 字符';
                outputCharCount.textContent = mainOutput.value.length + ' 字符';
            }

            function updateFormulaBadge(count) {
                formulaBadge.textContent = count + ' 个公式';
            }

            function updateStyleCards() {
                radioItems.forEach(function(item) {
                    const input = item.querySelector('input[type="radio"]');
                    item.classList.toggle('active', !!(input && input.checked));
                });
            }

            function updateCheckboxVisual() {
                blockNewlineWrap.classList.toggle('checked', blockNewlineChk.checked);
            }

            // ========== 核心：转换 ==========
            function convert() {
                const text = mainInput.value;
                const style = getSelectedStyle();
                const blockNewline = blockNewlineChk.checked;

                const nodes = parseFormulas(text, blockNewline);
                const formulaCount = nodes.filter(function(n) {
                    return n.type !== 'text';
                }).length;

                mainOutput.value = renderNodes(nodes, style, blockNewline);

                updateCharCounts();
                updateFormulaBadge(formulaCount);
            }

            // ========== 复制到剪贴板 ==========
            function copyToClipboard() {
                const outputText = mainOutput.value;
                if (!outputText) {
                    showToast('⚠️ 输出框为空，没有内容可复制');
                    copyBtn.style.backgroundColor = '#fef3c7';
                    copyBtn.style.color = '#92400e';
                    copyBtn.style.borderColor = '#fcd34d';
                    setTimeout(function() {
                        copyBtn.style.backgroundColor = '';
                        copyBtn.style.color = '';
                        copyBtn.style.borderColor = '';
                    }, 600);
                    return;
                }

                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(outputText).then(function() {
                        showCopySuccess();
                    }).catch(function() {
                        fallbackCopy(outputText);
                    });
                } else {
                    fallbackCopy(outputText);
                }
            }

            function fallbackCopy(text) {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.style.position = 'fixed';
                textarea.style.left = '-9999px';
                textarea.style.top = '-9999px';
                textarea.style.opacity = '0';
                document.body.appendChild(textarea);
                textarea.select();
                textarea.setSelectionRange(0, textarea.value.length);
                try {
                    const success = document.execCommand('copy');
                    if (success) {
                        showCopySuccess();
                    } else {
                        showToast('❌ 复制失败，请手动选择输出框内容复制');
                    }
                } catch (err) {
                    showToast('❌ 复制失败，请手动选择输出框内容复制');
                }
                document.body.removeChild(textarea);
            }

            function showCopySuccess() {
                copyBtn.classList.add('copied');
                const originalText = copyBtn.textContent;
                copyBtn.textContent = '✅ 已复制！';
                if (copiedTimeout) clearTimeout(copiedTimeout);
                copiedTimeout = setTimeout(function() {
                    copyBtn.classList.remove('copied');
                    copyBtn.textContent = originalText;
                }, 1800);
            }

            // ========== 简易 Toast ==========
            function showToast(message) {
                const existingToast = document.querySelector('.toast-message');
                if (existingToast) existingToast.remove();

                const toast = document.createElement('div');
                toast.className = 'toast-message';
                toast.textContent = message;
                toast.style.cssText = [
                    'position: fixed',
                    'bottom: 30px',
                    'left: 50%',
                    'transform: translateX(-50%)',
                    'background: #1f2937',
                    'color: #fff',
                    'padding: 12px 24px',
                    'border-radius: 8px',
                    'font-size: 14px',
                    'font-weight: 600',
                    'box-shadow: 0 8px 30px rgba(0,0,0,0.2)',
                    'z-index: 9999',
                    'animation: toastIn 0.3s ease',
                    'max-width: 90vw',
                    'text-align: center',
                    'letter-spacing: 0.3px'
                ].join(';');

                const styleEl = document.createElement('style');
                styleEl.textContent =
                    '@keyframes toastIn {' +
                    '  from { opacity: 0; transform: translateX(-50%) translateY(20px); }' +
                    '  to { opacity: 1; transform: translateX(-50%) translateY(0); }' +
                    '}' +
                    '@keyframes toastOut {' +
                    '  from { opacity: 1; transform: translateX(-50%) translateY(0); }' +
                    '  to { opacity: 0; transform: translateX(-50%) translateY(20px); }' +
                    '}';

                document.head.appendChild(styleEl);
                document.body.appendChild(toast);

                setTimeout(function() {
                    toast.style.animation = 'toastOut 0.3s ease';
                    setTimeout(function() {
                        toast.remove();
                        styleEl.remove();
                    }, 300);
                }, 2200);
            }

            // ========== 事件绑定 ==========
            function bindEvents() {
                // 输入实时转换
                mainInput.addEventListener('input', convert);

                // 目标风格切换
                styleRadios.forEach(function(radio) {
                    radio.addEventListener('change', function() {
                        updateStyleCards();
                        convert();
                    });
                });

                // 换行块级公式
                blockNewlineChk.addEventListener('change', function() {
                    updateCheckboxVisual();
                    convert();
                });

                // 转换按钮
                convertBtn.addEventListener('click', function() {
                    convert();
                    showToast('✅ 已按「' + getSelectedStyle().toUpperCase() + '」风格完成转换');
                });

                // 清空按钮
                clearBtn.addEventListener('click', function() {
                    mainInput.value = '';
                    mainOutput.value = '';
                    updateCharCounts();
                    updateFormulaBadge(0);
                    mainInput.focus();
                });

                // 复制按钮
                copyBtn.addEventListener('click', copyToClipboard);

                // Ctrl/Cmd + Enter 复制
                document.addEventListener('keydown', function(e) {
                    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                        e.preventDefault();
                        copyToClipboard();
                    }
                });

                // 输入框中 Tab 插入制表符
                mainInput.addEventListener('keydown', function(e) {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        const tabChar = '\t';
                        this.value = this.value.substring(0, start) + tabChar + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + tabChar.length;
                        convert();
                    }
                });
            }

            // ========== 初始化 ==========
            function init() {
                mainInput.value = DEFAULT_INPUT;
                updateStyleCards();
                updateCheckboxVisual();
                bindEvents();
                convert();
            }

            init();

            // ========== 暴露到全局，便于调试 ==========
            window.__formulaConverter = {
                parseFormulas: parseFormulas,
                renderNodes: renderNodes,
                convert: convert,
                getSelectedStyle: getSelectedStyle
            };

        })();
    </script>
</body>
</html>
