<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中西文间距自动格式化</title>
<style>
:root{
  --bg-color:#f0f2f5;--card-bg:#ffffff;--primary:#4a6cf7;--primary-hover:#3b5de7;
  --success:#22c55e;--success-hover:#16a34a;--danger:#ef4444;--danger-hover:#dc2626;
  --border:#e5e7eb;--text:#1f2937;--text-secondary:#6b7280;
  --shadow:0 2px 8px rgba(0,0,0,.06),0 4px 24px rgba(0,0,0,.04);
  --radius:12px;--radius-sm:8px;--transition:.2s ease;
  --font-mono:'JetBrains Mono','Fira Code','Cascadia Code','Consolas','Monaco',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:'Inter','PingFang SC','Microsoft YaHei','Helvetica Neue',-apple-system,sans-serif;
  background:var(--bg-color);color:var(--text);min-height:100vh;padding:32px 24px;
  display:flex;justify-content:center;align-items:flex-start;line-height:1.5;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
.container{
  width:100%;max-width:1280px;background:var(--card-bg);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:32px 28px;border:1px solid var(--border);
}
.header{text-align:center;margin-bottom:28px}
.header h1{
  font-size:28px;font-weight:700;letter-spacing:-.5px;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:10px;
}
.header h1 .icon{font-size:30px}
.header p{color:var(--text-secondary);font-size:14px;margin-top:6px}

.main-area{display:flex;gap:20px;align-items:stretch;margin-bottom:32px;flex-wrap:wrap}
.textarea-wrapper{flex:1 1 0;min-width:260px;display:flex;flex-direction:column;position:relative}
.textarea-wrapper label{
  display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
  color:var(--text-secondary);margin-bottom:8px;letter-spacing:.3px;text-transform:uppercase;
}
.textarea-wrapper label .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot.input-dot{background:var(--primary)}
.dot.output-dot{background:var(--success)}
.textarea-wrapper textarea{
  flex:1;min-height:280px;padding:16px 18px;border:2px solid var(--border);
  border-radius:var(--radius-sm);font-family:var(--font-mono);font-size:14px;line-height:1.6;
  resize:vertical;transition:border-color var(--transition),box-shadow var(--transition);
  background:#fafbfc;color:var(--text);outline:none;white-space:pre-wrap;
  word-wrap:break-word;tab-size:4;
}
.textarea-wrapper textarea:focus{
  border-color:var(--primary);box-shadow:0 0 0 4px rgba(74,108,247,.1);background:#fff;
}
.textarea-wrapper textarea#mainOutput{background:#f8faf9;color:#1a3c34}
.textarea-wrapper textarea#mainOutput:focus{
  border-color:var(--success);box-shadow:0 0 0 4px rgba(34,197,94,.1);background:#fff;
}
.textarea-wrapper textarea::placeholder{color:#9ca3af;font-style:italic}
.textarea-wrapper textarea[readonly]{cursor:default;-webkit-user-select:text;user-select:text}
.char-count{
  font-size:11px;color:var(--text-secondary);text-align:right;margin-top:4px;
  font-family:var(--font-mono);opacity:.7;
}

.button-group{
  display:flex;flex-direction:column;gap:10px;justify-content:center;
  align-items:stretch;padding:0 4px;min-width:150px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 18px;border:none;border-radius:var(--radius-sm);
  font-size:14px;font-weight:600;cursor:pointer;transition:all var(--transition);
  white-space:nowrap;letter-spacing:.3px;user-select:none;-webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid rgba(74,108,247,.4);outline-offset:2px}
.btn-convert{background:var(--primary);color:#fff;border:2px solid var(--primary)}
.btn-convert:hover{background:var(--primary-hover);border-color:var(--primary-hover);box-shadow:0 4px 14px rgba(74,108,247,.35)}
.btn-clear{background:#fef2f2;color:var(--danger);border:2px solid #fecaca}
.btn-clear:hover{background:var(--danger);color:#fff;border-color:var(--danger);box-shadow:0 4px 14px rgba(239,68,68,.3)}
.btn-copy{background:#ecfdf5;color:var(--success);border:2px solid #a7f3d0}
.btn-copy:hover{background:var(--success);color:#fff;border-color:var(--success);box-shadow:0 4px 14px rgba(34,197,94,.3)}
.btn-copy.copied{background:var(--success);color:#fff;border-color:var(--success);animation:pop .35s ease}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}

.divider{border:none;border-top:2px dashed var(--border);margin:8px 0 28px}

.options-section{margin-top:4px}
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:18px;flex-wrap:wrap;gap:10px;
}
.section-header h2{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px}
.section-header h2 .badge{
  background:var(--primary);color:#fff;font-size:12px;font-weight:600;
  padding:2px 10px;border-radius:20px;letter-spacing:.5px;
}
.section-header .hint{font-size:12px;color:var(--text-secondary);font-style:italic}

.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.legend-item{
  display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-secondary);
  background:#fafbfc;border:1px solid var(--border);border-radius:20px;padding:4px 12px;
  font-family:var(--font-mono);
}
.legend-item .swatch{width:10px;height:10px;border-radius:50%}
.swatch.han{background:#f59e0b}
.swatch.west{background:var(--primary)}
.swatch.punct{background:#9ca3af}
.swatch.protect{background:#a855f7}

@media (max-width:768px){
  body{padding:16px 10px}
  .container{padding:20px 14px}
  .main-area{flex-direction:column;gap:16px}
  .textarea-wrapper{min-width:100%}
  .textarea-wrapper textarea{min-height:170px}
  .button-group{flex-direction:row;flex-wrap:wrap;min-width:100%;justify-content:stretch;padding:0}
  .button-group .btn{flex:1 1 100px;min-width:100px}
  .header h1{font-size:22px}
}
@media (max-width:400px){
  .button-group .btn{flex:1 1 100%}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1><span class="icon">␣</span> 中西文间距自动格式化</h1>
    <p>汉字 ↔ 西文/数字自动补空格 · 公式与 [[...]] 内部原样保留 · 实时预览</p>
  </div>

  <div class="main-area">
    <div class="textarea-wrapper">
      <label><span class="dot input-dot"></span> 输入文本</label>
      <textarea id="mainInput" placeholder="在此输入或粘贴包含中英混排的文本..." spellcheck="false"></textarea>
      <span class="char-count" id="inputCharCount">0 字符</span>
    </div>

    <div class="textarea-wrapper">
      <label><span class="dot output-dot"></span> 输出结果</label>
      <textarea id="mainOutput" readonly placeholder="处理结果将实时显示在这里..." spellcheck="false"></textarea>
      <span class="char-count" id="outputCharCount">0 字符</span>
    </div>

    <div class="button-group">
      <button class="btn btn-convert" id="convertBtn" title="按当前设置重新处理（输入变化时会自动处理）">🚀 转换</button>
      <button class="btn btn-clear" id="clearBtn" title="清空输入和输出框">🗑️ 清空</button>
      <button class="btn btn-copy" id="copyBtn" title="复制输出框内容到剪贴板（Ctrl+Enter）">📋 复制到剪切板</button>
    </div>
  </div>

  <hr class="divider">

  <div class="options-section">
    <div class="section-header">
      <h2>⚙️ 处理设置 <span class="badge" id="formulaBadge">0 个受保护段</span></h2>
      <span class="hint">💡 汉字与西文字符之间补 1 个空格；标点两侧不留空格</span>
    </div>
    <div class="legend">
      <span class="legend-item"><span class="swatch han"></span>汉字</span>
      <span class="legend-item"><span class="swatch west"></span>西文/数字/西文符号</span>
      <span class="legend-item"><span class="swatch punct"></span>标点</span>
      <span class="legend-item"><span class="swatch protect"></span>公式 / [[...]] 受保护区</span>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

// ========== DOM ==========
const mainInput        = document.getElementById('mainInput');
const mainOutput       = document.getElementById('mainOutput');
const clearBtn         = document.getElementById('clearBtn');
const copyBtn          = document.getElementById('copyBtn');
const convertBtn       = document.getElementById('convertBtn');
const inputCharCount   = document.getElementById('inputCharCount');
const outputCharCount  = document.getElementById('outputCharCount');
const formulaBadge     = document.getElementById('formulaBadge');

let copiedTimeout = null;

// ========== 默认示例 ==========
const DEFAULT_INPUT = [
  '质能方程$E=mc^2$由爱因斯坦提出，$$\\int_0^\\infty e^{-x^2}\\,dx = \\frac{\\sqrt{\\pi}}{2}$$ 是高斯积分。',
  '',
  '考虑k-最近邻算法，中文-English混排，50%的增长率。',
  '',
  '参见[[页面]]了解，价格是$5元。',
  '',
  '洛伦兹因子\\( \\gamma = \\frac{1}{\\sqrt{1 - v^2/c^2}} \\)出现在相对论中。',
  '',
  '<math>a^2 + b^2 = c^2</math>是勾股定理。'
].join('\n');

// ========== 字符分类 ==========
// 西文符号：用户明确要求 $ % & 等按西文字符处理
const WEST_SYMBOLS = '$%&@#~^+*=<>|';

// CJK 统一表意文字（含扩展、兼容区）
const HAN_RE = /[\u3400-\u4DBF\u4E00-\u9FFF\uF900-\uFAFF\u{20000}-\u{2A6DF}\u{2A700}-\u{2EBEF}\u{30000}-\u{3134F}]/u;

function classifyChar(ch){
  if (ch === '\n' || ch === '\r') return 'newline';
  if (/\s/.test(ch)) return 'space';           // 半角/全角空格、Tab 等
  if (HAN_RE.test(ch)) return 'han';
  if (WEST_SYMBOLS.indexOf(ch) !== -1) return 'west';
  if (/[\p{L}\p{N}]/u.test(ch)) return 'west'; // 拉丁/希腊/西里尔/全角字母数字/带变音字母
  return 'punct';
}

// ========== 分词 ==========
// 产出 token：{ type, text }
// type: han | west | punct | space | newline | formula | protect
function tokenize(text){
  const tokens = [];
  let i = 0;

  while (i < text.length){
    const rest = text.slice(i);

    // ---- $$ ... $$ ----
    if (rest.startsWith('$$')){
      const end = text.indexOf('$$', i + 2);
      if (end !== -1){
        tokens.push({ type:'formula', text: text.slice(i, end + 2) });
        i = end + 2;
        continue;
      }
    }

    // ---- \[ ... \] ----
    if (rest.startsWith('\\[')){
      const end = text.indexOf('\\]', i + 2);
      if (end !== -1){
        tokens.push({ type:'formula', text: text.slice(i, end + 2) });
        i = end + 2;
        continue;
      }
    }

    // ---- \( ... \) ----
    if (rest.startsWith('\\(')){
      const end = text.indexOf('\\)', i + 2);
      if (end !== -1){
        tokens.push({ type:'formula', text: text.slice(i, end + 2) });
        i = end + 2;
        continue;
      }
    }

    // ---- <math ...> ... </math> ----
    if (rest.startsWith('<math')){
      const m = /^<math(?:\s[^>]*)?>/.exec(rest);
      if (m){
        const openEnd = i + m[0].length;
        const closeIdx = text.indexOf('</math>', openEnd);
        if (closeIdx !== -1){
          tokens.push({ type:'formula', text: text.slice(i, closeIdx + 7) });
          i = closeIdx + 7;
          continue;
        }
      }
    }

    // ---- [[ ... ]] ----
    if (rest.startsWith('[[')){
      const end = text.indexOf(']]', i + 2);
      if (end !== -1){
        tokens.push({ type:'protect', text: text.slice(i, end + 2) });
        i = end + 2;
        continue;
      }
    }

    // ---- $ ... $（单 $，未配对时落到字符分类） ----
    if (text[i] === '$' && text[i + 1] !== '$'){
      const end = text.indexOf('$', i + 1);
      if (end !== -1){
        tokens.push({ type:'formula', text: text.slice(i, end + 1) });
        i = end + 1;
        continue;
      }
    }

    // ---- 单字符 ----
    const ch = text[i];
    tokens.push({ type: classifyChar(ch), text: ch });
    i++;
  }

  return tokens;
}

// ========== 边界类型 ==========
// formula 整体看作西文 token（左右边界都是 west）
// protect（[[...]]）边界按 [ ] 处理，即 punct
function getBoundaryTypes(t){
  if (t.type === 'formula') return { left:'west', right:'west' };
  if (t.type === 'protect') return { left:'punct', right:'punct' };
  return { left:t.type, right:t.type };
}

// ========== 空格规则 ==========
function spacingAction(prevRight, currLeft){
  const pair = prevRight + '+' + currLeft;
  if (pair === 'han+west' || pair === 'west+han') return 'one';   // 汉字↔西文：补/压成 1 个空格
  if (pair === 'han+punct' || pair === 'punct+han') return 'zero'; // 汉字↔标点：删空格
  return 'keep'; // 其余保持原样（如 west↔west 的英文内部空格）
}

// ========== 组装 ==========
function processSpacing(tokens){
  let out = '';
  let pendingSpace = '';
  let prevRight = null;

  for (const t of tokens){
    if (t.type === 'space'){
      pendingSpace += t.text;
      continue;
    }
    if (t.type === 'newline'){
      out += pendingSpace + t.text;
      pendingSpace = '';
      prevRight = null;
      continue;
    }

    const bounds = getBoundaryTypes(t);

    if (prevRight === null){
      // 文本开头 / 换行之后：原样输出待定空格
      if (pendingSpace){ out += pendingSpace; pendingSpace = ''; }
    } else {
      const action = spacingAction(prevRight, bounds.left);
      if (action === 'one'){
        out += ' ';
        pendingSpace = '';
      } else if (action === 'zero'){
        pendingSpace = '';
      } else { // keep
        if (pendingSpace){ out += pendingSpace; pendingSpace = ''; }
      }
    }

    out += t.text;
    prevRight = bounds.right;
  }

  out += pendingSpace;
  return out;
}

// ========== 对外主函数 ==========
function transform(text){
  const tokens = tokenize(text);
  const protectedCount = tokens.filter(t => t.type === 'formula' || t.type === 'protect').length;
  return { text: processSpacing(tokens), protectedCount };
}

// ========== 界面辅助 ==========
function updateCharCounts(){
  inputCharCount.textContent  = mainInput.value.length + ' 字符';
  outputCharCount.textContent = mainOutput.value.length + ' 字符';
}

function updateFormulaBadge(count){
  formulaBadge.textContent = count + ' 个受保护段';
}

// ========== 核心 ==========
function convert(){
  const result = transform(mainInput.value);
  mainOutput.value = result.text;
  updateCharCounts();
  updateFormulaBadge(result.protectedCount);
}

// ========== 复制 ==========
function copyToClipboard(){
  const text = mainOutput.value;
  if (!text){
    showToast('⚠️ 输出框为空，没有内容可复制');
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopySuccess).catch(function(){ fallbackCopy(text); });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  ta.style.top = '-9999px';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  ta.setSelectionRange(0, ta.value.length);
  try {
    if (document.execCommand('copy')) showCopySuccess();
    else showToast('❌ 复制失败，请手动选择输出框内容复制');
  } catch (e){
    showToast('❌ 复制失败，请手动选择输出框内容复制');
  }
  document.body.removeChild(ta);
}

function showCopySuccess(){
  copyBtn.classList.add('copied');
  const original = copyBtn.textContent;
  copyBtn.textContent = '✅ 已复制！';
  if (copiedTimeout) clearTimeout(copiedTimeout);
  copiedTimeout = setTimeout(function(){
    copyBtn.classList.remove('copied');
    copyBtn.textContent = original;
  }, 1800);
}

// ========== Toast ==========
function showToast(message){
  const old = document.querySelector('.toast-message');
  if (old) old.remove();

  const toast = document.createElement('div');
  toast.className = 'toast-message';
  toast.textContent = message;
  toast.style.cssText = [
    'position:fixed','bottom:30px','left:50%','transform:translateX(-50%)',
    'background:#1f2937','color:#fff','padding:12px 24px','border-radius:8px',
    'font-size:14px','font-weight:600','box-shadow:0 8px 30px rgba(0,0,0,.2)',
    'z-index:9999','animation:toastIn .3s ease','max-width:90vw',
    'text-align:center','letter-spacing:.3px'
  ].join(';');

  const styleEl = document.createElement('style');
  styleEl.textContent =
    '@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}' +
    '@keyframes toastOut{from{opacity:1;transform:translateX(-50%) translateY(0)}to{opacity:0;transform:translateX(-50%) translateY(20px)}}';

  document.head.appendChild(styleEl);
  document.body.appendChild(toast);

  setTimeout(function(){
    toast.style.animation = 'toastOut .3s ease';
    setTimeout(function(){ toast.remove(); styleEl.remove(); }, 300);
  }, 2200);
}

// ========== 事件绑定 ==========
function bindEvents(){
  mainInput.addEventListener('input', convert);

  convertBtn.addEventListener('click', function(){
    convert();
    showToast('✅ 已完成间距格式化');
  });

  clearBtn.addEventListener('click', function(){
    mainInput.value = '';
    mainOutput.value = '';
    updateCharCounts();
    updateFormulaBadge(0);
    mainInput.focus();
  });

  copyBtn.addEventListener('click', copyToClipboard);

  document.addEventListener('keydown', function(e){
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter'){
      e.preventDefault();
      copyToClipboard();
    }
  });

  mainInput.addEventListener('keydown', function(e){
    if (e.key === 'Tab'){
      e.preventDefault();
      const start = this.selectionStart;
      const end = this.selectionEnd;
      this.value = this.value.substring(0, start) + '\t' + this.value.substring(end);
      this.selectionStart = this.selectionEnd = start + 1;
      convert();
    }
  });
}

// ========== 初始化 ==========
function init(){
  mainInput.value = DEFAULT_INPUT;
  bindEvents();
  convert();
}

init();

// ========== 调试接口 ==========
window.__spacingFormatter = {
  tokenize: tokenize,
  transform: transform,
  classifyChar: classifyChar,
  convert: convert
};

})();
</script>
</body>
</html>
