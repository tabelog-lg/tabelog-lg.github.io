<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>进度文档解码/编码器</title>
    <style>

/* ==========================================================================
   base.css · 全站基础层（每个页面都要引用）
   --------------------------------------------------------------------------
   只放「所有页面都用得到」的东西：设计变量、重置、页面骨架、页头、
   区块头、分隔线、页脚、基础响应式。
   不含任何按页面区分的规则（没有 body.page-xxx 这类选择器）。

   往上一层按需追加其一：
     nav.css        → 导航类页面（工具导航 / 历史版本 / Deductrium 相关）
     tools.css      → 小工具页面（ddtparse / formula / space / replace）
     tools-form.css → 小工具中的表单控件（只有用到选项区的工具才引）
   再往上一层：每个页面独有的样式直接内联在 HTML 的 <style> 里。
   ========================================================================== */

/* ============================ 01 设计变量 ============================ */
:root {
    --bg-color: #f0f2f5;
    --card-bg: #ffffff;
    --primary: #4a6cf7;
    --primary-hover: #3b5de7;
    --primary-soft: #eef2ff;
    --primary-line: #c7d2fe;
    --success: #22c55e;
    --success-hover: #16a34a;
    --danger: #ef4444;
    --danger-hover: #dc2626;
    --border: #e5e7eb;
    --text: #1f2937;
    --text-secondary: #6b7280;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.06), 0 4px 24px rgba(0, 0, 0, 0.04);
    --radius: 12px;
    --radius-sm: 8px;
    --transition: 0.2s ease;
    --font-mono: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', 'Monaco', monospace;
}

/* ========================= 02 重置与页面骨架 ========================= */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', -apple-system, sans-serif;
    background: var(--bg-color);
    color: var(--text);
    min-height: 100vh;
    padding: 32px 24px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
}

.container {
    width: 100%;
    max-width: 1280px;
    background: var(--card-bg);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 32px 28px;
    border: 1px solid var(--border);
}

/* ============================= 03 页头 ============================= */
.header {
    text-align: center;
    margin-bottom: 28px;
}
.header h1 {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}
.header h1 .icon {
    font-size: 30px;
}
.header p {
    color: var(--text-secondary);
    font-size: 14px;
    margin-top: 6px;
}

/* ========================= 04 区块头 / 徽标 ========================= */
.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 10px;
}
.section-header h2 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
}

.badge {
    background: var(--primary);
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    letter-spacing: 0.5px;
}

.hint {
    font-size: 12px;
    color: var(--text-secondary);
    font-style: italic;
}

/* ============================ 05 分隔线 ============================ */
.divider {
    border: none;
    border-top: 2px dashed var(--border);
    margin: 8px 0 28px;
}

/* ============================= 06 页脚 ============================= */
.footer {
    margin-top: 26px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 12.5px;
    color: var(--text-secondary);
}
.footer a {
    color: var(--primary);
    font-weight: 600;
    text-decoration: none;
}
.footer a:hover {
    text-decoration: underline;
}

/* 行内代码（页脚 / 说明文字共用） */
code {
    font-family: var(--font-mono);
    font-size: 12.5px;
    padding: 1px 6px;
    background: var(--primary-soft);
    border-radius: 4px;
    color: var(--primary);
}

/* ============================ 07 响应式 ============================ */
@media (max-width: 768px) {
    body {
        padding: 16px 10px;
    }
    .container {
        padding: 20px 14px;
    }
    .header h1 {
        font-size: 22px;
    }
}

@media (max-width: 400px) {
    .header h1 {
        font-size: 19px;
    }
}

/* ==========================================================================
   tools.css · 小工具核心层（配合 base.css 使用）
   --------------------------------------------------------------------------
   适用：ddtparse.html / formula-style-conversion.html /
         space-format.html / text-replace.html
   只放 4 个小工具都用得到的东西：主区域、文本域、按钮、提示消息。
   表单类控件在 tools-form.css（只有带选项区的工具才引）；
   单个工具特有的样式（图例、替换列表、上传区等）已内联到对应 HTML。
   ========================================================================== */

/* 选项区容器（无选项的工具页也可用它包裹说明性区块） */
.options-section {
    margin-top: 4px;
}

/* ======================== 01 主区域 / 文本域 ======================== */
.main-area {
    display: flex;
    gap: 20px;
    align-items: stretch;
    margin-bottom: 32px;
    flex-wrap: wrap;
}

.textarea-wrapper {
    flex: 1 1 0;
    min-width: 260px;
    display: flex;
    flex-direction: column;
    position: relative;
}
/* 整行独占的文本域（如“输出框”） */
.textarea-wrapper.full-width {
    flex: none;
    width: 100%;
    min-width: 0;
    margin-bottom: 26px;
}

.textarea-wrapper label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-secondary);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
}
.textarea-wrapper label .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex: none;
}
/* 色点：输入 / 输出 / 第三类输出（可按需取用） */
.dot.input-dot {
    background: var(--primary);
}
.dot.output-dot {
    background: var(--success);
}
.dot.proof-dot {
    background: #8b5cf6;
}

.textarea-wrapper textarea {
    flex: 1;
    width: 100%;
    min-height: 280px;
    padding: 16px 18px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: var(--font-mono);
    font-size: 14px;
    line-height: 1.6;
    resize: vertical;
    transition: border-color var(--transition), box-shadow var(--transition), background var(--transition);
    background: #fafbfc;
    color: var(--text);
    outline: none;
    white-space: pre-wrap;
    word-wrap: break-word;
    tab-size: 4;
}
.textarea-wrapper textarea:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
    background: #fff;
}
.textarea-wrapper textarea::placeholder {
    color: #9ca3af;
    font-style: italic;
}
.textarea-wrapper textarea[readonly] {
    cursor: default;
    -webkit-user-select: text;
    user-select: text;
}

/* 结果输出框（绿色系）：#mainOutput 通用 / .output-area 供自定义命名使用 */
.textarea-wrapper textarea#mainOutput,
.textarea-wrapper textarea.output-area {
    background: #f8faf9;
    color: #1a3c34;
}
.textarea-wrapper textarea#mainOutput:focus,
.textarea-wrapper textarea.output-area:focus {
    border-color: var(--success);
    box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1);
    background: #fff;
}

.char-count {
    font-size: 11px;
    color: var(--text-secondary);
    text-align: right;
    margin-top: 4px;
    font-family: var(--font-mono);
    opacity: 0.7;
}

/* ============================= 02 按钮 ============================= */
.button-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    justify-content: center;
    align-items: stretch;
    padding: 0 4px;
    min-width: 150px;
}

.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 18px;
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    white-space: nowrap;
    background: #f3f4f6;
    color: var(--text);
    transition: all var(--transition);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.btn:active {
    transform: scale(0.96);
}
.btn:focus-visible {
    outline: 3px solid rgba(74, 108, 247, 0.4);
    outline-offset: 2px;
}
.btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
}

/* --- 主色（btn-convert 与 btn-primary 同款，两种命名都支持） --- */
.btn-primary,
.btn-convert {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}
.btn-primary:hover:not(:disabled),
.btn-convert:hover {
    background: var(--primary-hover);
    border-color: var(--primary-hover);
    box-shadow: 0 4px 14px rgba(74, 108, 247, 0.35);
}

/* --- 成功色 --- */
.btn-success {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
}
.btn-success:hover:not(:disabled) {
    background: var(--success-hover);
    border-color: var(--success-hover);
    box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
}

/* --- 次级 / 柔和 --- */
.btn-secondary {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary-line);
}
.btn-secondary:hover:not(:disabled) {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 14px rgba(74, 108, 247, 0.3);
}

.btn-soft {
    background: #fafbfc;
    color: var(--text);
    border-color: var(--border);
}
.btn-soft:hover:not(:disabled) {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: var(--primary-line);
    box-shadow: 0 4px 14px rgba(74, 108, 247, 0.15);
}

/* --- 危险 / 清空 --- */
.btn-clear {
    background: #fef2f2;
    color: var(--danger);
    border-color: #fecaca;
}
.btn-clear:hover:not(:disabled) {
    background: var(--danger);
    color: #fff;
    border-color: var(--danger);
    box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3);
}

/* --- 复制 --- */
.btn-copy {
    background: #ecfdf5;
    color: var(--success);
    border-color: #a7f3d0;
}
.btn-copy:hover {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
    box-shadow: 0 4px 14px rgba(34, 197, 94, 0.3);
}
.btn-copy.copied {
    background: var(--success);
    color: #fff;
    border-color: var(--success);
    animation: pop 0.35s ease;
}
@keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.06); }
    100% { transform: scale(1); }
}

/* ========================== 03 提示消息 ========================== */
.error-message {
    margin-top: 18px;
    padding: 12px 16px;
    background: #fef2f2;
    border: 1px solid #fecaca;
    border-left: 4px solid var(--danger);
    border-radius: var(--radius-sm);
    color: #b91c1c;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
    display: none;
}
.info-message {
    margin-top: 18px;
    padding: 12px 16px;
    background: #ecfdf5;
    border: 1px solid #a7f3d0;
    border-left: 4px solid var(--success);
    border-radius: var(--radius-sm);
    color: #15803d;
    font-size: 13.5px;
    display: none;
}

/* ============================ 04 响应式 ============================ */
@media (max-width: 768px) {
    .main-area {
        flex-direction: column;
        gap: 16px;
    }
    .textarea-wrapper {
        min-width: 100%;
    }
    .textarea-wrapper textarea {
        min-height: 170px;
    }
    .button-group {
        flex-direction: row;
        flex-wrap: wrap;
        min-width: 100%;
        justify-content: stretch;
        padding: 0;
    }
    .button-group .btn {
        flex: 1 1 100px;
        min-width: 100px;
    }
}

@media (max-width: 400px) {
    .button-group .btn {
        flex: 1 1 100%;
    }
}

/* ==========================================================================
   tools-form.css · 小工具表单控件层（配合 base.css + tools.css 使用）
   --------------------------------------------------------------------------
   只有带「选项区」的小工具才需要引用：
     ddtparse.html（模式下拉 + 证明选项复选）
     formula-style-conversion.html（目标风格单选 + 复选）
   space-format.html / text-replace.html 没有选项区，不引这个文件。
   ========================================================================== */

.option-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
}
.option-row + .option-row {
    margin-top: 14px;
}

.option-label {
    flex: none;
    min-width: 76px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: var(--text-secondary);
}

/* --- 下拉选择 --- */
.option-row select {
    flex: 1 1 240px;
    min-width: 0;
    padding: 11px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: #fafbfc;
    cursor: pointer;
    outline: none;
    transition: all var(--transition);
}
.option-row select:hover {
    border-color: var(--primary-line);
    background: #f5f7ff;
}
.option-row select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(74, 108, 247, 0.1);
    background: #fff;
}

/* --- 单选卡片 --- */
.radio-group {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    flex: 1;
    min-width: 0;
}
.radio-item {
    flex: 1 1 180px;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fafbfc;
    cursor: pointer;
    transition: all var(--transition);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.radio-item:hover {
    border-color: var(--primary-line);
    background: #f5f7ff;
}
.radio-item.active {
    border-color: var(--primary);
    background: var(--primary-soft);
    box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
}
.radio-item input[type="radio"] {
    flex: none;
    width: 17px;
    height: 17px;
    accent-color: var(--primary);
    cursor: pointer;
}
.radio-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
    min-width: 0;
}
.radio-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.3;
}
.radio-desc {
    font-size: 11.5px;
    font-family: var(--font-mono);
    color: var(--text-secondary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}
.radio-item.active .radio-title {
    color: var(--primary);
}

/* --- 复选框（两种风格，按所在容器自动区分） --- */
.checkbox-group {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    flex: 1 1 480px;
    min-width: 0;
}

.checkbox-item {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 11px 16px;
    border: 2px solid var(--border);
    border-radius: var(--radius-sm);
    background: #fafbfc;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    transition: all var(--transition);
    -webkit-tap-highlight-color: transparent;
}
.checkbox-item:hover {
    border-color: var(--primary-line);
    background: #f5f7ff;
}
.checkbox-item input[type="checkbox"] {
    flex: none;
    cursor: pointer;
}
/* 选中态：:has() 自动识别 / .checked 由脚本切换，两种都支持 */
.checkbox-item:has(input:checked),
.checkbox-item.checked {
    border-color: var(--primary);
    background: var(--primary-soft);
}
.checkbox-item:has(input:checked) {
    color: var(--primary);
}
.checkbox-item.checked {
    box-shadow: 0 0 0 3px rgba(74, 108, 247, 0.08);
}
.checkbox-item em {
    font-style: normal;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
}

/* 紧凑胶囊式（.checkbox-group 内）：自绘方框 */
.checkbox-group .checkbox-item {
    gap: 8px;
    padding: 9px 14px;
}
.checkbox-group .checkbox-item input[type="checkbox"] {
    appearance: none;
    -webkit-appearance: none;
    width: 18px;
    height: 18px;
    margin: 0;
    border: 2px solid #cbd5e1;
    border-radius: 5px;
    background: #fff;
    position: relative;
    transition: all var(--transition);
}
.checkbox-group .checkbox-item input[type="checkbox"]:checked {
    background: var(--primary);
    border-color: var(--primary);
}
.checkbox-group .checkbox-item input[type="checkbox"]:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 0;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
}
.checkbox-group .checkbox-item input[type="checkbox"]:focus-visible {
    outline: 3px solid rgba(74, 108, 247, 0.35);
    outline-offset: 2px;
}

/* 整行铺开式（.option-row 直挂）：浏览器原生方框 */
.option-row > .checkbox-item {
    display: flex;
    flex: 1;
    min-width: 0;
}
.option-row > .checkbox-item input[type="checkbox"] {
    width: 17px;
    height: 17px;
    accent-color: var(--primary);
}

/* ============================ 响应式 ============================ */
@media (max-width: 768px) {
    .option-row {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
    }
    .option-label {
        min-width: 0;
    }
    .radio-group {
        flex-direction: column;
    }
    .radio-item {
        flex: 1 1 auto;
    }
    .option-row > .checkbox-item {
        align-items: flex-start;
    }
    .checkbox-group {
        flex-direction: column;
        align-items: stretch;
        flex: 1 1 auto;
    }
    .checkbox-group .checkbox-item {
        width: 100%;
    }
}

/* ===== 本页专属：文件上传区 + 尺寸微调 ===== */
.main-area { margin-bottom: 20px; }
.divider { margin: 22px 0 26px; }
.textarea-wrapper textarea { min-height: 240px; font-size: 13.5px; }
.textarea-wrapper textarea.output-area { min-height: 200px; }
/* 按钮较多，横向排布 */
.button-group { flex-direction: row; flex-wrap: wrap; min-width: 0; padding: 0; }
.button-group .btn { flex: 1 1 160px; padding: 13px 20px; }

/* 文件上传区（仅本页使用） */
.file-zone {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    align-items: stretch;
    margin-bottom: 26px;
}
.file-upload-label {
    flex: 1 1 260px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 24px;
    background: var(--primary-soft);
    color: var(--primary);
    border: 2px dashed var(--primary-line);
    border-radius: var(--radius-sm);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.3px;
    cursor: pointer;
    text-align: center;
    transition: all var(--transition);
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}
.file-upload-label:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    border-style: solid;
    box-shadow: 0 4px 14px rgba(74, 108, 247, 0.3);
}
.file-upload-label:active { transform: scale(0.98); }
.file-upload-label input[type="file"] { display: none; }

@media (max-width: 768px) {
    .file-zone { flex-direction: column; }
    .button-group .btn { flex: 1 1 100%; }
    .rule-search-row {
        flex-direction: column;
        align-items: stretch;
    }
}

/* ===== 本页专属：推理规则搜索 ===== */
.rule-search-row {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 26px;
}
.rule-search-wrap {
    position: relative;
    flex: 1 1 260px;
    min-width: 0;
}
#ruleSearchInput {
    width: 100%;
    box-sizing: border-box;
    padding: 11px 16px;
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    background: #fafbfc;

}

.rule-search-box {

<body class="page-ddtparse">

    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>
                <span class="icon">🔧</span> 进度文档解码 / 编码器
            </h1>
            <p>上传游戏进度文件，解码为可读文本 · 修改后重新编码并下载</p>
        </div>

        <!-- 游戏模式 -->
        <div class="option-row">
            <span class="option-label">游戏模式</span>
            <select id="modeSelect">
                <option value="survival" selected>生存模式 (survival)</option>
                <option value="creative">创造模式 (creative)</option>
            </select>
            <span class="hint">💡 编码 / 解码需使用相同的模式</span>
        </div>

        <!-- ★ 新增：证明项 / 排列表 选项 -->
        <div class="option-row">
            <span class="option-label">证明选项</span>
            <div class="checkbox-group" id="proofOptionGroup">
                <label class="checkbox-item" title="编码/提取证明项时，附带用户自定义的推理规则（mc, mf, mprd）">
                    <input type="checkbox" id="chkCustomRules" checked>
                    <span>在证明项中加入自定义推理规则</span>
                </label>
                <label class="checkbox-item" title="生成排列表时，在名称后加入定理内容显示">
                    <input type="checkbox" id="chkContentDisplay" checked>
                    <span>在排列表中加入定理内容显示</span>
                </label>
                <label class="checkbox-item" title="编码/提取证明项时，显示该推理规则依赖的推理规则">
                    <input type="checkbox" id="chkDependentRules" checked>
                    <span>在证明项中加入依赖推理规则</span>
                </label>
            </div>
        </div>

        <hr class="divider">

        <!-- 文件操作区 -->
        <div class="file-zone">
            <label class="file-upload-label">
                📂 上传进度文档文件
                <input type="file" id="fileInput" accept=".txt,.json,.dat,text/plain,application/json">
            </label>
            <button id="btnDownload" class="btn btn-success" disabled>⬇️ 下载编码结果</button>
        </div>

        <!-- ★ 新增：推理规则搜索 -->
        <div class="rule-search-row">
            <span class="option-label">规则搜索</span>
            <div class="rule-search-wrap">
                <input id="ruleSearchInput" type="text" placeholder="输入推理规则名称…"
                       autocomplete="off" spellcheck="false">
                <div id="ruleSearchBox" class="rule-search-box"></div>
            </div>
            <button id="btnSearchRule" class="btn btn-soft">🔍 搜索</button>
        </div>

        <!-- 主区域：编码文档 / 解码文本 -->
        <div class="main-area">
            <div class="textarea-wrapper">
                <label><span class="dot input-dot"></span> 编码文档（进度字符串）</label>
                <textarea id="encodedText" placeholder="将编码进度文档粘贴到这里，或上传文件自动填充..." spellcheck="false"></textarea>
            </div>
            <div class="textarea-wrapper">
                <label><span class="dot output-dot"></span> 解码后的文本（可编辑）</label>
                <textarea id="jsonText" placeholder="点击“解码”按钮生成解码文本，可修改后重新编码..." spellcheck="false"></textarea>
            </div>
        </div>

        <!-- 输出框 -->
        <div class="textarea-wrapper full-width">
            <label><span class="dot proof-dot"></span> 输出框（证明项 / 类型层证明项 / 排列表）</label>
            <textarea id="proofText" class="output-area" placeholder="点击下方按钮生成对应内容..." readonly spellcheck="false"></textarea>
        </div>

        <!-- 按钮组 -->
        <div class="button-group">
            <button id="btnDecode" class="btn btn-primary">🔓 解码 → 文本</button>
            <button id="btnEncode" class="btn btn-secondary">🔒 编码 → 进度文档</button>
            <button id="btnExtractProofs" class="btn btn-soft">📜 提取证明项</button>
            <button id="btnExtractTypeProofs" class="btn btn-soft">🧩 提取类型层证明项</button>
            <button id="btnShowArrangement" class="btn btn-soft">🌳 展示排列表</button>
            <button id="btnClear" class="btn btn-clear">🧹 清空</button>
        </div>

        <!-- 错误 / 信息显示 -->
        <div id="errorMsg" class="error-message"></div>
        <div id="infoMsg" class="info-message"></div>

        <div class="footer">
            基于游戏内部序列化逻辑 | 不依赖游戏环境
        </div>
    </div>

    <script>

// ==================== 随机数生成器 ====================

class Rnd {
    constructor(x) { this.x = x >>> 0; }
    next() {
        this.x = ((this.x + 0x19da44d9) + (this.x << 8)) >>> 0;
        this.x = (this.x ^ (this.x >>> 4)) >>> 0;
        this.x = ((this.x * 0xb5502e5) + (this.x >>> 0)) >>> 0;
        return (this.x >>> 0) / 0x100000000;
    }
}

// ==================== 洗牌与中文处理 ====================

class Shuffle {
    static shuffleArray(array, randomFunction) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(randomFunction.next() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }
    static shuffleArrayReverse(array, randomFunction) {
        const nums = new Array(array.length).fill(0).map((_, i) => i);
        Shuffle.shuffleArray(nums, randomFunction);
        const res = new Array(array.length);
        for (const [i, j] of nums.entries()) {
            res[j] = array[i];
        }
        return res.join("");
    }
    static replaceZh(a) {
        let r = "";
        for (let i = 0; i < a.length; i++) {
            if (a.charCodeAt(i) > 0xFF) {
                r += "U`" + a.charCodeAt(i).toString(36) + ".";
            } else {
                r += a[i];
            }
        }
        return r;
    }
    static recoverZh(a) {
        let r = a[0];
        let code = "?";
        for (let i = 1; i < a.length; i++) {
            if (code !== "?") {
                if (a[i] !== ".") {
                    code += a[i];
                } else {
                    r = r.slice(0, -1);
                    r += String.fromCharCode(Number.parseInt(code, 36));
                    code = "?";
                }
            } else if (a[i] === "`" && a[i - 1] === "U") {
                code = "";
            } else {
                r += a[i];
            }
        }
        return r;
    }
}

// ==================== 核心编码/解码函数 ====================

function encodeProgressDoc(jsonStr, mode = 'survival') {
    let processed = jsonStr;
    for (const [a, b] of replaceArr1) {
        processed = processed.replaceAll(a, b);
    }
    processed = Shuffle.replaceZh(processed);
    const seed = (mode === 'survival') ? processed.length : (processed.length - 1);
    const rnd = new Rnd(seed);
    const shuffled = Shuffle.shuffleArray(Array.from(processed), rnd);
    return shuffled.join("");
}

function decodeProgressDoc(encodedStr, mode = 'survival') {
    const seed = (mode === 'survival') ? encodedStr.length : (encodedStr.length - 1);
    const rnd = new Rnd(seed);
    const unshuffled = Shuffle.shuffleArrayReverse(Array.from(encodedStr), rnd);
    const recoveredZh = Shuffle.recoverZh(unshuffled);
    let result = recoveredZh;
    for (const [a, b] of replaceArr2) {
        result = result.replaceAll(b, a);
    }
    return result;
}

// ==================== 解码结果分段 ====================

/*
    解码后的整体结构：
    [第一部分]-(=)-[第二部分]-(=)-[第三部分]-(=)-[第四部分]

    第一部分：[[成就与门],推理素数量,已使用推理素数量,拆门数,步数,[最大已达到序数的PrSS表示],序数进位基底,(未知，可选项)]
    第二部分：2,2,2,1,...:0.5898,...:1
    第三部分：[[常量定义表],[函数定义表],[谓词定义表],[[],元规则表],{推理规则表},[排列表],[]]
    第四部分：[类型层证明项表]
*/

function splitDecodedParts(decoded) {
    const parts = decoded.split(splittor);
    if (parts.length < 4) {
        throw new Error(
            `解码结果格式错误：期望以 "${splittor}" 分隔成 4 个部分，实际得到 ${parts.length} 个`
        );
    }
    return parts;
}

// 解析第三部分（修正：7 个元素，索引左移）
function parseSection3(str) {
    let obj;
    try {
        obj = JSON.parse(str);
    } catch (e) {
        throw new Error('第三部分不是合法 JSON：' + e.message);
    }
    if (!Array.isArray(obj)) throw new Error('第三部分不是数组');

    // 结构：[[常量],[函数],[谓词],[[],元规则],{推理规则},[排列表],[]]
    //  索引：   0     1     2        3          4          5      6
    return {
        constTable:  obj[0] || [],   // 常量定义表
        funcTable:   obj[1] || [],   // 函数定义表
        predTable:   obj[2] || [],   // 谓词定义表
        metaRules:   obj[3] || [],   // [[], 元规则表]
        rules:       obj[4] || {},   // 推理规则表   ← 原为 obj[5]
        arrangement: obj[5] || [],   // 排列表       ← 原为 obj[6]
        extra:       obj[6] || []    // 末尾空表
    };
}

// 读取解码文本并取出第三部分
function getSection3() {
    const decoded = jsonTextarea.value.trim();
    if (!decoded) throw new Error('请先解码或粘贴解码后的文本到文本框');
    const parts = splitDecodedParts(decoded);
    return parseSection3(parts[2].trim());
}

// 读取解码文本并取出第四部分原始字符串
function getSection4Raw() {
    const decoded = jsonTextarea.value.trim();
    if (!decoded) throw new Error('请先解码或粘贴解码后的文本到文本框');
    const parts = splitDecodedParts(decoded);
    return parts[3].trim();
}

// ==================== 证明项提取功能 ====================

// 判断一个值是否是单个定理定义：[sequent, tag, steps, ...]
// 只要求前 3 项有效，后面的项忽略
function isTheoremDef(v) {
    return Array.isArray(v) && v.length >= 3
        && typeof v[0] === 'string'      // sequent
        && typeof v[1] === 'string'      // tag
        && Array.isArray(v[2]);          // steps
}

// 只按顶层逗号切分：圆括号 () 和花括号 {} 内的逗号不分割
function splitTopLevelCommas(s) {
    const parts = [];
    let depth = 0;
    let start = 0;
    for (let i = 0; i < s.length; i++) {
        const c = s[i];
        if (c === '(' || c === '{') depth++;
        else if (c === ')' || c === '}') depth--;
        else if (c === ',' && depth === 0) {
            parts.push(s.slice(start, i));
            start = i + 1;
        }
    }
    parts.push(s.slice(start));
    return parts;
}

/* ============================================================
   ★ 新增：规则顺序表缓存
   ------------------------------------------------------------
   数据来源：第三部分的排列表（sec3.arrangement）
   规则：剔除所有以 "< f >" 开头的文件夹项，剩下的按原顺序组成数组
        （注意 "< f >" 含空格，与 parseFolderItem / buildArrangementTree
          中的判定保持一致，共 5 个字符）
   构建时机：第一次被 getOrder() 调用时构建，之后直接复用
   失效时机：见下方 decodeAction / btnClear / jsonTextarea input
   ============================================================ */
const RuleOrderStore = (() => {
    let order = null;   // string[] | null   规则名顺序表

    function build() {
        // 1. 取出排列表（getSection3 会解析解码文本的第三部分）
        const sec3  = getSection3();
        const items = Array.isArray(sec3.arrangement) ? sec3.arrangement : [];

        // 2. 过滤掉所有文件夹项，保留规则名，维持原顺序
        const list = [];
        for (const item of items) {
            if (typeof item !== 'string') continue;    // 非字符串项直接跳过
            if (item.startsWith('< f >')) continue;    // "< f >" 开头 = 文件夹，跳过
            list.push(item);
        }

        order = list;
    }

    return {
        // 取规则顺序表（首次调用时构建）
        getOrder() {
            if (order === null) build();
            return order;
        },
        // 令缓存失效（解码文本变化后调用）
        invalidate() {
            order = null;
        }
    };
})();

/* ============================================================
   ★ 改写：通过 steps 分析该定理依赖的推理规则
   规则顺序表由 RuleOrderStore 统一提供，不在本函数内重复解析
   ============================================================ */
const extractAtoms = (() => {
    const UNARY_OPS = new Set(['<', '>', 'c', 'v', 'u', 'e']);
    const DELIMITERS = new Set([':', ',']);

    function parse(expr) {
        const n = expr.length;

        function _parse(i) {
            if (i >= n) throw new Error('表达式意外结束');
            const ch = expr[i];

            if (UNARY_OPS.has(ch)) {
                const [child, end] = _parse(i + 1);
                return [{ op: ch, children: [child], start: i, end }, end];
            }

            if (ch === ':') {
                const start = i;
                i += 1;
                const children = [];

                while (true) {
                    if (i >= n) throw new Error('冒号后缺少操作数');

                    const [child, next] = _parse(i);
                    children.push(child);
                    i = next;

                    if (i >= n) throw new Error('冒号表达式缺少逗号');

                    if (expr[i] === ':') {
                        i += 1;
                        continue;
                    }

                    if (expr[i] === ',') {
                        i += 1;
                        if (i >= n) throw new Error('逗号后缺少操作数');

                        const [last, end] = _parse(i);
                        children.push(last);
                        return [{ op: ':', children, start, end }, end];
                    }

                    throw new Error("冒号后需要 ':' 或 ','");
                }
            }

            if (ch === ',') throw new Error('意外的逗号');

            let j = i;
            while (j < n && !DELIMITERS.has(expr[j])) j += 1;
            if (j === i) throw new Error(`无法识别的字符: ${ch}`);

            return [{ op: expr.slice(i, j), children: [], start: i, end: j }, j];
        }

        const [root, end] = _parse(0);
        if (end !== n) {
            throw new Error(`表达式解析到位置 ${end} 后仍有剩余字符`);
        }
        return root;
    }

    function collectAtoms(node) {
        if (node.children.length === 0) return [node.op];

        const result = [];
        for (const child of node.children) {
            result.push(...collectAtoms(child));
        }
        return result;
    }

    return function extractAtoms(expr) {
        return collectAtoms(parse(expr));
    };
})();

// ===== 辅助方法：处理 unknown 规则 =====
function processUnknownRules(unknown) {
    // 数字出现负数，例如：.1*-2、.-2--3
    const hasNegativeNumber = (s) => /(^|[.@+*\/-])-\d/.test(s);

    // natop 类：d11（数字 > 10）、.1@N、.1+2、.3*4 等
    const isNatop = (s) => {
        const dMatch = s.match(/d(\d+)/);
        if (dMatch && parseInt(dMatch[1], 10) > 10) return true;

        if (/\.\d+@N/.test(s)) return true;
        if (/\.\d+\+\d+/.test(s)) return true;
        if (/\.\d+\*\d+/.test(s)) return true;

        return false;
    };

    // dZn 类：dZ0、dZ1、dZ-1
    const isDZn = (s) => /dZ-?\d+/.test(s);

    let hasNatop = false;
    let hasDZn = false;
    let hasDZop = false;
    const unknownRest = new Set();

    for (const rawName of unknown) {
        // 如果 unknown 中包含 '#'，先去掉
        let name = rawName.includes('#') ? rawName.replace(/#/g, '') : rawName;

        if (!name) continue;

        // natop 类，换成 natop
        if (isNatop(name)) {
            hasNatop = true;
            continue;
        }

        // dZn 类，换成 dZn（需优先于负数判断，避免 dZ-1 被误判）
        if (isDZn(name)) {
            hasDZn = true;
            continue;
        }

        // 负数优先，换成 dZop
        if (hasNegativeNumber(name)) {
            hasDZop = true;
            continue;
        }

        // 排除之后的 unknown
        unknownRest.add(name);
    }

    const result = [];

    // 总顺序：natop, dZn, dZop
    if (hasNatop) result.push('natop');
    if (hasDZn) result.push('dZn');
    if (hasDZop) result.push('dZop');

    // 然后是排除了之后的 unknown，继续源代码逻辑：加 #
    for (const name of unknownRest) {
        result.push(`#${name}`);
    }

    return result;
}

// ===== 目标方法 =====
function getDependentRules(steps) {
    // 首次调用时构建，之后 O(1) 取用；调用方无需关心缓存细节
    const ruleOrder = RuleOrderStore.getOrder();

    // 记录规则在 ruleOrder 中的位置
    const orderIndex = new Map(
        Array.from(ruleOrder, (name, i) => [name, i])
    );

    // 解析每个 step 的 [0]，取并集，保留首次出现顺序
    const seen = new Set();

    for (const step of steps) {
        const expr = step[0];
        if (typeof expr !== 'string') continue;

        const atoms = extractAtoms(expr);
        for (const atom of atoms) {
            seen.add(atom);
        }
    }

    const unknown = [];
    const known = [];

    for (const name of seen) {
        if (orderIndex.has(name)) {
            known.push(name);
        } else {
            unknown.push(name);
        }
    }

    // ruleOrder 中越靠后的，最终越靠前
    known.sort((a, b) => orderIndex.get(b) - orderIndex.get(a));

    // 处理 unknown：natop/dZop 在最前，然后是排除了之后的 unknown（加 #）
    const processedUnknown = processUnknownRules(unknown);

    // 最终结果：处理后的 unknown + 其他原子公式
    return [
        ...processedUnknown,
        ...known,
    ];
}

// 把单个定理转成证明项文本（只使用前 3 项，输出中不含 tag）
function convertTheorem(name, sequent, tag, steps) {
    // 输出首行：名字 + 内容（去掉原来的 tag 部分）
    let output = `${name} ${sequent}\n`;

    // 可选：依赖推理规则
    if (isProofOptionEnabled('dependentRules')) {
        const deps = getDependentRules(steps);
        output += `[依赖：${deps.join(', ')}]\n`;
    }

    let left = '';
    if (sequent.includes('⊢')) {
        left = sequent.split('⊢')[0];
    } else {
        left = sequent;
    }
    // 只按顶层逗号切分前提，避免把有序对 "($a1,$b1)" 或 "{$0,$1}" 拆开
    const hyps = left.trim()
        ? splitTopLevelCommas(left).map(s => s.trim()).filter(s => s.length > 0)
        : [];

    const lines = [];
    for (const h of hyps) {
        lines.push(`hyp ${h}`);
    }

    const base = hyps.length;
    for (let i = 0; i < steps.length; i++) {
        const [rule, refs, vars] = steps[i];
        const currentLine = base + i;
        const args = [];
        for (const r of refs) {
            if (r < 0) {
                args.push(String(currentLine + r));
            } else {
                args.push(String(r));
            }
        }
        if (Array.isArray(vars)) args.push(...vars);
        if (args.length > 0) {
            lines.push(`d ${rule} ${args.join(' ')}`);
        } else {
            lines.push(`d ${rule}`);
        }
    }
    return output + lines.join('\n');
}

// 遍历推理规则表

function extractProofsFromRules(rules) {
    if (!rules || typeof rules !== 'object' || Array.isArray(rules)) {
        throw new Error('推理规则表不是对象');
    }

    const opts = getProofOptions();
    const specials = [];  // 特殊条目：name以dv/df/dc开头，tag为'元规则生成*'，steps为null
    const normals = [];   // 普通定理条目

    for (const [name, value] of Object.entries(rules)) {
        // 优先处理特殊条目（此时 steps 为 null，不满足 isTheoremDef 的数组要求）
        if (
            Array.isArray(value) && value.length >= 3 &&
            typeof value[0] === 'string' &&          // sequent
            typeof value[1] === 'string' &&          // tag
            value[1] === '元规则生成*' &&
            value[2] === null &&
            (name.startsWith('dv') || name.startsWith('df') || name.startsWith('dc'))
        ) {
            // 仅在开启“自定义推理规则”时显示
            if (opts.customRules) {
                specials.push(`${name} ${value[0]}`);
            }
            continue;
        }

        // 普通定理：必须满足 isTheoremDef，且 tag 不是 '元规则生成*'
        if (!isTheoremDef(value)) continue;
        const [sequent, tag, steps] = value;
        if (tag === '元规则生成*') continue;
        normals.push(convertTheorem(name, sequent, tag, steps));
    }

    // 特殊条目排在最前面，之间不空行；之后空一行再接原来的输出内容
    let output = specials.join('\n');
    if (normals.length > 0) {
        if (specials.length > 0) {
            output += '\n\n';
        }
        output += normals.join('\n\n');
    }
    return output;
}

// ==================== 类型层证明项提取 ====================
function extractTypeLevelProofs(raw) {
    let arr;
    try {
        arr = JSON.parse(raw);
    } catch (e) {
        throw new Error('第四部分不是合法 JSON：' + e.message);
    }
    if (!Array.isArray(arr)) throw new Error('第四部分不是数组');
    return arr.map(s => String(s)).join('\n');
}

function resolveRuleContent(name, rules) {
    // 1. 优先查硬编码字典
    if (Object.prototype.hasOwnProperty.call(THEOREM_CONTENT_DICT, name)) {
        return String(THEOREM_CONTENT_DICT[name]);
    }
    // 2. 再查推理规则表：value = [sequent, tag, steps, ...]
    if (rules && typeof rules === 'object' && !Array.isArray(rules)
        && Object.prototype.hasOwnProperty.call(rules, name)) {
        const v = rules[name];
        if (Array.isArray(v) && typeof v[0] === 'string') {
            return v[0];
        }
    }
    // 3. 都没有
    return '表达式因未知错误而丢失';
}

// ==================== 排列表树状展示 ====================
/*
    排列表形如：
      ["<f>命题逻辑::80::1kbb30::+", "<f>公理::4::ohryb4::+", "mp", ...]
    - "<f>" 前缀表示文件夹
    - 参数以 "::" 分隔（注意：无空格），第一项是名字，第二项是其下（不含自己）项的总数
    - 其余项为推理规则名称
*/
function parseFolderItem(item) {
    let body;
    if (item.startsWith('< f >#')) {
        body = item.slice(6);
    } else if (item.startsWith('< f >')) {
        body = item.slice(5);
    } else {
        body = item;
    }

    const segs = body.split('::');
    const name = (segs[0] || '').trim();
    const count = Number.parseInt(segs[1], 10);
    return { name, count: Number.isFinite(count) ? count : 0 };
}

function buildArrangementTree(items, rules) {
    const showContent = isProofOptionEnabled('contentDisplay');

    function parse(pos, end) {
        const nodes = [];
        while (pos < end) {
            const item = items[pos];
            if (typeof item === 'string' && item.startsWith('< f >')) {
                const { name, count } = parseFolderItem(item);
                const childEnd = Math.min(pos + 1 + count, end);
                const children = parse(pos + 1, childEnd);
                nodes.push({ type: 'folder', name, count, children });
                pos = childEnd;
            } else {
                const name = String(item);
                const content = showContent ? resolveRuleContent(name, rules) : '';
                nodes.push({ type: 'rule', name, content });
                pos++;
            }
        }
        return nodes;
    }
    return parse(0, items.length);
}

function renderTree(nodes, prefix = '') {
    let out = '';
    nodes.forEach((node, idx) => {
        const isLast = idx === nodes.length - 1;
        const branch = isLast ? '└─ ' : '├─ ';
        const childPrefix = prefix + (isLast ? '   ' : '│  ');
        if (node.type === 'folder') {
            out += prefix + branch + '📁 ' + node.name + '\n';
            out += renderTree(node.children, childPrefix);
        } else {
            const suffix = node.content ? ' ' + node.content : '';
            out += prefix + branch + node.name + suffix + '\n';
        }
    });
    return out;
}

    const content = encodedTextarea.value;
    if (!content) { showError('没有可下载的内容'); return; }
    const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'progress_document.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showInfo('下载已开始');
});

// ==================== 推理规则搜索 ====================

// 取可搜索的规则名全集：排列表中显示的所有推理规则
function getSearchCandidates() {
    return Array.from(RuleOrderStore.getOrder());
}

// 原子推理规则：THEOREM_CONTENT_DICT 中的规则，以及 processUnknownRules 聚合出的类别名
const ATOMIC_EXTRA_RULES = new Set(['natop', 'dZn', 'dZop']);

function isAtomicRule(name) {
    return Object.prototype.hasOwnProperty.call(THEOREM_CONTENT_DICT, name)
        || ATOMIC_EXTRA_RULES.has(name);
}

// 递归收集依赖闭包（迭代栈实现，避免深递归）
// 包含根节点；闭包中每个节点要么原子、要么无 steps（视作叶子）
function computeRuleDependencyClosure(root, rules) {
    const closure = new Set();
    const visited = new Set();
    const stack = [root];

    while (stack.length) {
        const n = stack.pop();
        if (visited.has(n)) continue;
        visited.add(n);

        closure.add(n);

        if (isAtomicRule(n)) continue;

        const v = rules[n];
        if (!isTheoremDef(v)) continue;
        const steps = v[2];
        if (!Array.isArray(steps)) continue;

        const deps = getDependentRules(steps);
        for (const d of deps) {
            if (!visited.has(d)) stack.push(d);
        }
    }
    return closure;
}

// 按「getDependentRules 的排序」排序一个规则集合
// 规则名：known 按 ruleOrder 位置降序 → unknown（processUnknownRules）→ 聚合名 natop/dZn/dZop
function sortRulesByDependentOrder(nameSet, orderIndex) {
    const known   = [];
    const unknown = [];
    const aggs    = new Set();

    for (const n of nameSet) {
        if (ATOMIC_EXTRA_RULES.has(n)) {
            aggs.add(n);                // 聚合名原样保留，不再过 processUnknownRules
        } else if (orderIndex.has(n)) {
            known.push(n);
        } else {
            unknown.push(n);
        }
    }

    // known：orderIndex 大的在前（与 getDependentRules 一致）
    known.sort((a, b) => orderIndex.get(b) - orderIndex.get(a));

    // 聚合名固定顺序 natop, dZn, dZop
    const aggHead = ['natop', 'dZn', 'dZop'].filter(x => aggs.has(x));

    // unknown 过一遍 processUnknownRules（自动挑出 natop/dZn/dZop 类型并给其余加 #）
    const processedUnknown = processUnknownRules(unknown);

    return [...aggHead, ...processedUnknown, ...known];
}

let searchDismissed = false;   // 点击外部后关闭联想，直到下一次输入才复活

const escapeHtml = s => s.replace(/[&<>]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

function updateRuleSuggestions() {
    const q = ruleSearchInput.value;
    if (!q || searchDismissed) {
        ruleSearchBox.style.display = 'none';
        return;
    }

    let candidates = [];
    try {
        candidates = getSearchCandidates();
    } catch (e) {
        ruleSearchBox.innerHTML =
            '<div class="rule-search-empty">请先解码后再搜索</div>';
        ruleSearchBox.style.display = 'block';
        return;
    }

    const lq   = q.toLowerCase();
    const hits = candidates
        .filter(s => s.toLowerCase().startsWith(lq))
        .slice(0, 100);

    if (!hits.length) {
        ruleSearchBox.innerHTML =
            '<div class="rule-search-empty">无匹配规则</div>';
        ruleSearchBox.style.display = 'block';
        return;
    }
    ruleSearchBox.innerHTML = hits.map(s =>
        `<div data-name="${escapeHtml(s)}">` +
            `<b>${escapeHtml(s.slice(0, q.length))}</b>` +
            `${escapeHtml(s.slice(q.length))}` +
        `</div>`
    ).join('');
    ruleSearchBox.style.display = 'block';
}

function selectRuleSuggestion(name) {
    ruleSearchInput.value = name;
    searchDismissed = true;
    ruleSearchBox.style.display = 'none';
    ruleSearchInput.focus();
}

function searchRuleAction() {
    clearMessages();
    const name = ruleSearchInput.value.trim();
    if (!name) {
        showError('请先输入推理规则名称');
        return;
    }
    searchDismissed = true;
    ruleSearchBox.style.display = 'none';

    try {
        const sec3  = getSection3();
        const rules = sec3.rules || {};
        const order = RuleOrderStore.getOrder();
        const orderIndex = new Map(Array.from(order, (n, i) => [n, i]));

        const inOrder = orderIndex.has(name);
        const inDict  = Object.prototype.hasOwnProperty.call(THEOREM_CONTENT_DICT, name);
        const inRules = Object.prototype.hasOwnProperty.call(rules, name);
        if (!inOrder && !inDict && !inRules) {
            proofTextarea.value = '';
            showError(`未找到规则：${name}`);
            return;
        }

        // 递归收集依赖闭包（包含 name 自身）
        const closure = computeRuleDependencyClosure(name, rules);

        // 分类替换：只要闭包中出现某分类的任意规则，就合并为该分类名
        const triggeredCategories = new Set();
        const remainingRules = new Set();

        for (const r of closure) {
            const cat = RULE_CATEGORY_MAP.get(r);
            if (cat) {
                triggeredCategories.add(cat);
            } else {
                remainingRules.add(r);
            }
        }

        // 分类名按 CATEGORY_ORDER 排在最前
        const sortedCategories = CATEGORY_ORDER.filter(c => triggeredCategories.has(c));

        // 剩余规则：属于排列表的按排列顺序（orderIndex 升序）；
        // 不属于排列表的（如 natop、dZn、dZop、#xxx）按名称排序放在最后
        const remainingInOrder = [];
        const remainingNotInOrder = [];
        for (const r of remainingRules) {
            if (orderIndex.has(r)) {
                remainingInOrder.push(r);
            } else {
                remainingNotInOrder.push(r);
            }
        }
        remainingInOrder.sort((a, b) => orderIndex.get(a) - orderIndex.get(b));
        remainingNotInOrder.sort((a, b) => a.localeCompare(b));

        // 聚合名改为中文显示
        const displayName = (r) => {
            if (r === 'natop') return '自然数自动计算';
            if (r === 'dZn')   return '整数定义';
            if (r === 'dZop')  return '整数自动计算';
            return r;
        };

        const outputLines = [
            ...sortedCategories,
            ...remainingInOrder.map(displayName),
            ...remainingNotInOrder.map(displayName),
        ];

        proofTextarea.value = outputLines.join('\n');
        showInfo(`已搜索规则 ${name}，简化后共 ${outputLines.length} 项`);
    } catch (e) {
        proofTextarea.value = '';
        showError('搜索失败：' + e.message);
    }
}

        proofTextarea.value = header + renderTree(tree);

    } catch (e) {
        proofTextarea.value = '';
        showError('展示排列表失败：' + e.message);
        console.error(e);
    }
});

btnSearchRule.addEventListener('click', searchRuleAction);

ruleSearchInput.addEventListener('input', () => {
    searchDismissed = false;
    updateRuleSuggestions();
});

ruleSearchInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
        e.preventDefault();
        searchRuleAction();
    } else if (e.key === 'Escape') {
        searchDismissed = true;
        ruleSearchBox.style.display = 'none';
    }
});

// 点击联想行：填充输入框（不自动搜索，与示例一致）
ruleSearchBox.addEventListener('mousedown', e => {
    const row = e.target.closest('div[data-name]');
    if (!row) return;
    e.preventDefault();
    selectRuleSuggestion(row.dataset.name);
});

// 点击其他任何地方：关闭联想
document.addEventListener('mousedown', e => {
    if (!ruleSearchInput.contains(e.target) &&
        !ruleSearchBox.contains(e.target)) {
        searchDismissed = true;
        ruleSearchBox.style.display = 'none';
    }
});

btnDownload.disabled = true;
clearMessages();

    </script>
